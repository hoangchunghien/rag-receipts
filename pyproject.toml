[project]
name = "rag-receipts"
version = "0.1.0"
description = "RAG answers you can check: every sentence carries a verbatim quote, verified by string match, or it is cut."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Hien Hoang", email = "hoangchunghien@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
receipts = "rag_receipts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_receipts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdf"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
